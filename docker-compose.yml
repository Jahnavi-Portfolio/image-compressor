version: '3.8'

services:
  api:
    build: ./backend
    command: gunicorn src.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/imagedb
      - DASHBOARD_PASSWORD=GodMode_Komute2026!
      - DASHBOARD_SECRET=kM9pQ3vX2zY7wL4eJ1rA5tC8fN6bH0mK
    depends_on:
      - db

  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=imagedb

volumes:
  postgres_data:
